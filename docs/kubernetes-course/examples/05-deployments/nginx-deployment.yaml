apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    chapter: "05"
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 80
