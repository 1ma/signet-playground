apiVersion: v1
kind: Pod
metadata:
  name: httpd-probed
  labels:
    app: httpd-probed
    chapter: "03"
spec:
  containers:
    - name: httpd
      image: httpd:2.4
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 10
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 2
