apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
  labels:
    chapter: "08"
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 64Mi
